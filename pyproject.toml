[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haat-lister"
version = "0.1.0"
description = "Product-page to haat bulk-listing CSV automation"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    # Compression codecs, and they are NOT optional. Without brotli we would
    # still ask for it (a browser header set that omitted it would be unusual),
    # get it, and fail to decode -- which presented as "every shop but Amazon
    # has no photographs" rather than as an error. `zstd` is the same story one
    # release later; CDNs are already turning it on.
    "brotli>=1.1",
    "zstandard>=0.22",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "extruct>=0.17",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "protego>=0.3",
    # The local web console. Core rather than an extra: `serve` is the headline
    # command in v2, and an ImportError on the flagship path is a bad first run.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Multipart form parsing, for the v5 §4 import routes. A core dependency
    # rather than an extra: the console ships with the tool and file upload is
    # how §4.1 and §4.2 are reached from it, so an install without this has a
    # screen that 500s.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
llm = ["anthropic>=0.34"]
hosts = ["cloudinary>=1.40"]
# Optional, and the last thing built. runs/master.csv is the deliverable;
# this only copies it somewhere colleagues can see.
sheets = ["google-api-python-client>=2.100", "google-auth>=2.30"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
haat-lister = "haat_lister.cli:app"

[tool.setuptools.packages.find]
include = ["haat_lister*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

# These ship no type information. We type our own boundaries instead.
[[tool.mypy.overrides]]
module = ["extruct.*", "protego.*", "selectolax.*", "slugify.*", "cloudinary.*", "anthropic.*"]
ignore_missing_imports = true
